<style>
/* ── Styles locaux — page Documents ── */
.card-body .form-inline { height: 30px; }
.form-inline { gap: unset; margin-bottom:10px;  }

/* Barre de filtres */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-end;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-group label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--p67-text-muted);
  margin: 0;
}
.filter-group.filter-search { flex: 1; min-width: 180px; }
.filter-group.filter-search .input-wrap { position: relative; }
.filter-group.filter-search .input-wrap .mdi {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--p67-text-muted);
  font-size: 1rem;
  pointer-events: none;
}
.filter-group.filter-search input { padding-left: 32px; }

/* Zone d'upload */
.upload-zone {
  border: 2px dashed var(--p67-primary-border);
  background: var(--p67-primary-light);
  padding: 5px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  color: var(--p67-text-muted);
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--p67-primary);
  background: #e4edfa;
  color: var(--p67-primary);
}
.upload-zone .mdi { font-size: 1.8rem; display: block; margin-bottom: 4px; }
.upload-zone p  { margin: 0; font-size: 0.85rem; font-weight: 500; }
.upload-zone small { font-size: 0.75rem; }

/* Liste de documents */
.paper-list{display:flex;flex-direction:column;gap:10px;}
.paper-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--p67-border);
  cursor: pointer;
  transition:box-shadow .15s,border-color .15s;
  position: relative;
}
.paper-item:last-child { border-bottom: none; }
.paper-item:hover { background: var(--p67-primary-light); }


.paper-item2{display:flex;gap:12px;background:var(--pi-bg);border:1px solid var(--pi-border);border-left:4px solid var(--pi-border);
  border-radius:8px;padding:12px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.paper-item2:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.paper-item2:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(47,127,209,.35);}
.paper-item2.is-selected{border-color:#9cc3ea;}

.paper-ico {
  width: 38px; height: 38px; min-width: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--p67-primary-light);
  border: 1px solid var(--p67-primary-border);
  flex-shrink: 0;
  margin-top: 2px;
  transition: background .15s;
  font-size:26px;
  line-height:1;
  padding-top:1px;
  color:#8a96a3;
}
.paper-ico .mdi { font-size: 1.2rem; color: var(--p67-primary); }
.paper-item:hover .paper-ico { background: var(--p67-primary); }
.paper-item:hover .paper-ico .mdi { color: #fff; }

.paper-content { flex: 1; min-width: 0; }

.paper-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--p67-text);
  margin-bottom: 3px;
  line-height: 1.3;
}

.paper-head{display:flex;align-items:flex-start;gap:6px 10px;flex-wrap:wrap;}
.paper-title-line {flex:1 1 260px;min-width:0;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;}

.paper-ref{font:600 12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; border-radius:4px;padding:4px 10px;white-space:nowrap; border: 1px solid var(--p67-primary-border); color:rgb(74, 111, 165);background: var(--p67-primary-light)}
.paper-ref .mdi{color:rgb(74, 111, 165);margin-right:3px;}


.paper-meta {
  font-size: 0.78rem;
  color: var(--p67-text-muted);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.paper-meta span { display: flex; align-items: center; gap: 4px; }
.paper-meta .mdi { font-size: 0.85rem; }



.paper-state-draft   {border-left:4px solid var(--p67-border); background:var(--bg);}
.paper-state-expired {border-left:4px solid var(--p67-danger); background:var(--p67-danger-soft);}

.paper-state-current2 .paper-ico { background-color:var(--p67-success-soft);}
.paper-state-expired .paper-ico { border:1px solid var(--p67-danger); background-color:var(--p67-danger-soft);}


.paper-state-upcoming{border-left-color:var(--st-upcoming);}
.paper-state-checked {border-left-color:var(--st-checked);}






/* Pièces jointes en pills */
.paper-attachments { display: flex; flex-wrap: wrap; gap: 5px; }


.attach-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--p67-border);
  background: #f7f9fc;
  font-size: 0.75rem;
  font-weight: 500;
  
  border-radius: 10px;
  transition: background .15s, border-color .15s, color .15s;
  height: 30px;
  white-space: nowrap;
  overflow: hidden;
}
.attach-pill:hover {
  background: var(--p67-primary-light)!important;
  border-color: var(--p67-primary)!important;
}
.attach-pill a:hover {
  text-decoration: none;
  color: var(--p67-primary);
}
.attach-pill a {
  padding: 2px 9px;
  text-decoration: none;
  color: var(--p67-text);
}

/* Unread documents */
.attach-pill.unread {
  background-color: var(--p67-danger-soft);
  border: 1px solid var(--p67-danger);
}
.attach-pill .mdi { font-size: 0.85rem; }

/* Boutons d'action (hover) */
.paper-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
  padding-top: 2px;
}
.paper-item:hover .paper-actions { opacity: 1; }

.action-btn {
  width: 30px; height: 30px;
  border: none;
  background: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--p67-text-muted);
  cursor: pointer;
  font-size: 0.95rem;
  border-radius: 4px;
  transition: background .15s, color .15s;
}
.action-btn:hover { background: var(--p67-primary-light); color: var(--p67-primary); }
.action-btn.danger:hover { background: var(--p67-danger-soft); color: var(--p67-danger); }

/* État vide */
.paper-empty {
  padding: 40px;
  text-align: center;
  color: var(--p67-text-muted);
}
.paper-empty .mdi { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: .4; }

/* Modal — ajustements */
.modal-header-actions { display: flex; align-items: center; gap: 6px; }
.modal-icon-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--p67-border);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--p67-text-muted);
  font-size: 1rem;
  border-radius: 4px;
  transition: background .15s, color .15s, border-color .15s;
}
.modal-icon-btn:hover { background: var(--p67-primary-light); color: var(--p67-primary); border-color: var(--p67-primary-border); }
.modal-icon-btn.danger:hover { background: var(--p67-danger-soft); color: var(--p67-danger); border-color: #f5b8b5; }

.modal-fields-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}

.modal-upload-zone {
  border: 1px dashed var(--p67-primary-border);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  background: var(--p67-primary-light);
  color: var(--p67-text-muted);
  font-size: 0.82rem;
}
.modal-upload-zone:hover { border: 2px dashed var(--p67-primary); color: var(--p67-primary); background: #e4edfa; padding: 11px; }
.modal-upload-zone .mdi { font-size: 1.3rem; }

.modal-divider { height: 1px; background: var(--p67-border); margin: 16px 0; }

.modal-danger { border-bottom:1px solid var(--p67-danger); }


#modal-status { position: absolute;
  left: 90px;
  top: 59px;
  border: 1px solid var(--p67-danger);
  color: var(--p67-danger);
  padding: 0px 10px;
  background-color: var(--p67-danger-soft);
  border-radius: 10px; }
#modal-status:empty { display: none; }


/* tags */
.tagfield{position:relative; width:70%; }
.tagfield-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:38px;box-sizing:border-box;padding:4px 6px; border:1px solid #cfd6dd;border-radius:6px;background:#fff;cursor:text;}',
.tagfield.is-focused .tagfield-box{border-color:#2f7fd1;box-shadow:0 0 0 3px rgba(47,127,209,.18);}
.tagfield.is-readonly .tagfield-box{background:#f7f8fa;cursor:default;}
.tagchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:26px;box-sizing:border-box;padding:0 14px 0 9px; border-radius:999px;font-size:13px;color:#1f2933;background:#f1f3f5; background:color-mix(in srgb,var(--tag) 12%,#fff);border:1px solid color-mix(in srgb,var(--tag) 30%,#fff);}
.tagfield.is-readonly .tagchip{padding-right:9px;}
.tagchip::before{content:"#";flex:none;margin-right:-6px;font-weight:700;color:var(--tag);}
.tagchip-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tagchip-remove{flex:none;display:grid;place-items:center;width:18px;height:18px;padding:0;border:0;border-radius:50%; background:transparent;color:#6b7280;font-size:15px;line-height:1;cursor:pointer;}
.tagchip-remove:hover,.tagchip-remove:focus-visible{background:rgba(0,0,0,.08);color:#1f2933;outline:none;}
.tagchip.is-pending{box-shadow:0 0 0 2px var(--tag);}
/* Remise à zéro renforcée : les styles généraux du site pour input[type=text] ne doivent pas s'appliquer ici */
.tagfield .tagfield-box input.tagfield-entry{flex:1 1 120px !important;width:auto !important;min-width:120px;height:auto !important;margin:0 !important;
  border:0 !important;outline:none !important;box-shadow:none !important;border-radius:0 !important;padding:4px 2px !important;
  font:inherit;font-size:14px;background:transparent !important;color:#1f2933;}
.tagfield-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:2000;margin:0;padding:4px;list-style:none;
  background:#fff;border:1px solid #d5dbe1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:260px;overflow-y:auto;}
.tagfield-option{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:14px;color:#1f2933;}
.tagfield-option .dot{flex:none;width:auto;margin-right:-6px;font-weight:700;color:var(--tag);}
.tagfield-option .dot::before{content:"#";}
.tagfield-option .label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tagfield-option .label b{font-weight:700;}
.tagfield-option .scope{flex:none;font-size:12px;color:#6b7280;}
.tagfield-option.is-active{background:#eef4fb;}
.tagfield-empty{padding:8px 9px;font-size:13px;color:#6b7280;}

/* Commentaires dans modal */
.comment-block {
  background: var(--p67-primary-light);
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 0.82rem;
  color: var(--p67-text);
  border-left: 3px solid var(--p67-primary);
}
.comment-block .c-meta { font-size: 0.72rem; color: var(--p67-text-muted); margin-top: 4px; }

/* Compteur de documents */
#paperCount {
  font-size: 0.75rem;
  color: var(--p67-text-muted);
  font-weight: 400;
  margin-left: auto;
}



/* Badge */
.badge-wrapper {display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.badge-doc {display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.5; padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;text-transform:uppercase;}
.badge-mandatory { background-color:var(--p67-warning); }
.badge-controlled { background-color:var(--p67-success); }
.badge-expired { background-color:var(--p67-bg); border:1px solid var(--p67-border); }
.badge-review { background-color:var(--p67-warning); color:#ffffff;}
.badge-toread { background-color:var(--p67-danger); color:#ffffff; }
.badge-draft { background-color:var(--p67-white); border:1px solid var(--p67-border); }
.badge-submitted { background-color:var(--p67-success); color:#ffffff; }

/* Tabs */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid #e3e6ea;}
.tabs button{border:0;background:none;font:inherit;color:#6b7280;padding:9px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;}
.tabs button[aria-selected="true"]{color:#1f2933;font-weight:600;border-bottom-color:#1f2933;}

/* Read list */
.reads-list{max-height:60vh;overflow-y:auto;margin:8px -16px 0;padding:0 16px;}
.reads-group{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;
  padding:10px 0 4px;position:sticky;top:0;background:#fff;}
.read-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f4;}
.read-row:last-child{border-bottom:0;}
.read-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.read-name b{font-weight:600;}
.read-status{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:0 8px;border-radius:999px;line-height:1.6;}
.read-date{flex:none;width:100px;white-space:nowrap;text-align:right;font-size:12.5px;color:#6b7280;font-variant-numeric:tabular-nums;}
.st-read  {color:#2e7d4f;background:#effaf3;}
.st-reread{color:#1f5fa3;background:#eaf3fc;}
.st-unread{color:#b03a2e;background:#fdeeec;}
.st-viewed{color:#c27c0e;background:#ffeccf;}


</style>

          <input type="text" id="content-reference" class="form-control form-input" style="max-width:90px;" disabled>

	            <i class="mdi mdi-content-duplicate"></i>

              <div class="form-inline">
                <label>Version</label><input type="text" id="content-version" class="form-control form-input" disabled>
              </div>

        <!-- Pièces jointes -->
        <div id="adddoc" class="form-group">
          <label class="col-form-label" style="font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em;">Pièces jointes</label>
          <div id="addContentFile" class="modal-upload-zone">
            <label for="addFile" style="cursor:pointer; margin:0; display:inline-flex; align-items:center; gap:6px;">
              <i class="mdi mdi-cloud-upload-outline"></i>
              <span id="addContentText">Ajouter un fichier</span>
            </label>
            <input id="addFile" type="file" style="display:none">
          </div>
        </div>
		    <!-- END: adddoc -->
        <div class="form-group">
          <div id="modalAttachments" style="margin-top:8px; display:flex; flex-wrap:wrap; gap:5px;"></div>
        </div>

        <div class="modal-divider"></div>

        <div class="form-group">
          <div id="modalReadAll" style="margin-top:15px; "></div>
          <div id="modalConfirmRead" class="d-none" style="margin-top:15px; "><input type="checkbox" value="confirmed"> Confirmez que vous avez lu et compris les documents.</div>
          <div id="modalSigned" class="d-none" style="margin-top:15px; ">Fiche lue le xx/xx/xxxx</div>
        </div>


        <!-- Commentaires -->
        <div class="form-group">
          <label class="col-form-label" style="font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em;">Ajouter un commentaire</label>
          <textarea id="contentNewComment" class="form-control" rows="2" placeholder="Votre commentaire…"></textarea>
        </div>

        <div id="contentComment" class="profile-feed"></div>

  	  </div>

      <!-- Boutons -->
      <div class="modal-footer">
        <div class="row">
          <div>
            <!-- BEGIN: approve -->
            <input id="submit" type="button" value="Soumettre" class="btn btn-light btn-sm">
            <input id="approve" type="button" value="Approuver" class="btn btn-light btn-sm">
            <!-- END: approve -->
            <input id="save" type="button" value="Enregistrer" class="btn btn-primary btn-sm">
            <input id="cancel" type="button" value="Annuler" class="btn btn-light btn-sm">
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  $(document).ready(function() { loadPapers(); });

  var currentPaper = 0;
  var isEditing = false;
  var isAllRead = false;
  var isSigned = false;
  var lstDocuments = [];

  var openFolder={id};
  var openPaper = {paper};
  var openTag={idtag};


  $('#btn-summary').on('click', function() {
    $('#btn-summary').attr('aria-selected', 'true');;
    $('#btn-detail').attr('aria-selected', 'false');
    $('#btn-view').attr('aria-selected', 'false');
    $('#panel-summary').show();
    $('#panel-detail').hide();
    $('#panel-view').hide();
  });
  $('#btn-detail').on('click', function() {
    $('#btn-summary').attr('aria-selected', 'false');
    $('#btn-detail').attr('aria-selected', 'true');
    $('#btn-view').attr('aria-selected', 'false');
    $('#panel-summary').hide();
    $('#panel-detail').show();
    $('#panel-view').hide();
  });
  $('#btn-view').on('click', function() {
    $('#btn-summary').attr('aria-selected', 'false');
    $('#btn-detail').attr('aria-selected', 'false');
    $('#btn-view').attr('aria-selected', 'true');
    $('#panel-summary').hide();
    $('#panel-detail').hide();
    $('#panel-view').show();
  });

// ── Chargement liste ──────────────────────────────────────────
  function loadPapers() {
    var filter = $('#selectFilter').val();
    var date   = $('#selectDate').val();
    var crit   = $('#crit').val();
    var sort   = $('#selectSort').val();
    var paper  = null;

    $.get('/api/v1/docs/lstpaper?id='+openFolder+'&idtag='+openTag+'&filter='+filter+'&date='+date+'&sort='+sort+'&crit='+crit)
      .done(function(data){ 
        $('#lstPapers').html('');

        for (var k in data.data) 
        {
          renderPapers(data.data[k]);
        }

        if (openPaper>0)
        {
          loadContent(openPaper);
        }

      });

  }

  function renderPapers(data) 
  {
    var html = '';
    var dte_today = new Date();
    var dte_start = new Date(data.dte_start); 
    var dte_end = new Date(data.dte_end); 
    var dte_review = new Date(data.dte_review); 

    var paperStatus="";
    var paperStatusClass="";

    if (dte_end<dte_today)
    {
      paperStatusClass = 'paper-state-expired';
      paperStatus="expired";
    }
    else if (dte_start>dte_today)
    {
      paperStatusClass = 'paper-state-future';
      paperStatus="future";
    }
    else
    {
      paperStatusClass = 'paper-state-current';
      paperStatus="current";
    }

    if (data.status=='draft')
    {
      paperStatusClass = 'paper-state-draft';
      paperStatus="draft";
    }
    else if (data.status=='submitted')
    {
      paperStatusClass = 'paper-state-draft';
      paperStatus="submitted";
    }
    else if (data.status=='open')
    {
      paperStatus="open";
    }


    html='<div class="paper-item '+paperStatusClass+'" id="paperItem_51" tabindex="0" role="link" onclick="loadContent('+data.id+');">';
    html+='<div class="paper-ico"><i class="mdi mdi-file-document-outline"></i></div>';
    html+='<div class="paper-content">';
    html+='  <div class="paper-head">';
    html+='    <div class="paper-title-line">';
    if (data.controlled=='oui')
    {
      html+='      <span class="paper-ref" title="Document contrôlé"><i class="mdi mdi-shield-check-outline"></i>'+data.reference+'</span>';
      html+='      <span class="paper-version">v'+data.version+'</span>';
    }
    html+='      <span class="paper-title" id="paperTitle_51">'+data.title+'</span>';
    html+='    </div>';
    html+='    <div class="badge-wrapper">';

    // Brouillon
    if (data.status=='draft')
    {
      html+='      <span class="badge-doc badge-draft">Brouillon</span>';
    }
    // Doc à approuver
    if (data.status=='submitted')
    {
      html += '<span class="badge-doc badge-submitted">Soumis</span>';
    }
    // Doc à relire
    if (dte_review<dte_today)
    {
      html += '<span class="badge-doc badge-review">Revue échue</span>';
    }
    // Doc périmé
    if (dte_end<dte_today)
    {
      html += '<span class="badge-doc badge-expired">Périmé</span>';
    }
    // Doc non lu
    if ((data.mandatory=='oui') && (data.dte_read===null) && (data.status=='approved'))
    {
      html += '<span class="badge-doc badge-toread">A lire</span>';
    }


    html+='    </div>';
    html+='  </div>';
    html+='  <div class="paper-meta">';

    if (paperStatus=="current")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-check-circle-outline"></i>En vigueur depuis le '+data.begin+'</span>';
    }
    else if (paperStatus=="submitted")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clipboard-check-outline"></i>Vérifié le '+data.checked+' par '+data.reviewer+'</span>';
    }
    else if (paperStatus=="draft")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clock-outline"></i>Modifié le '+data.created+'</span>';
    }
    else if (paperStatus=="expired")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-archive-outline"></i>Périmé depuis le '+data.expire+'</span>';
    }
    else if (paperStatus=="open")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clock-outline"></i>Ajouté le '+data.created+'</span>';
    }

    html+=' - <span><i class="mdi mdi-account-outline"></i>'+data.author+'</span>';
    <!-- BEGIN: writer -->
    if (data.mandatory=='oui')
    {
      html+='    <span class="writer-only"><i class="mdi mdi-account-multiple-check"></i>Lu par '+data.nbread+' / '+data.nbtotalread+'</span>';
    }
    <!-- END: writer -->

    html+='  </div>';
    html+='  <div class="paper-attachments">';

    for (var d in data.doc) {
      html += '<div class="attach-pill '+((data.doc[d].read) ? "" : "unread")+'"><a href="/doc.php?docid='+data.doc[d].id+'" target="_blank" onclick="event.stopPropagation();">';
      html += '<i class="mdi mdi-file-'+data.doc[d].icon+'" style="color:'+data.doc[d].color+';"></i> ' + data.doc[d].name + '</a></div>';
    }
    html+='  </div>';
    html+='</div>';
    html+='</div>';

    $('#lstPapers').append(html);
  }

  // ── Ouverture modal ───────────────────────────────────────────
  function loadContent(id)
  {
    currentPaper = id;
    isEditing = false;
    $('#btn-summary').attr('aria-selected', 'true');;
    $('#btn-detail').attr('aria-selected', 'false');
    $('#btn-view').attr('aria-selected', 'false');
    $('#panel-summary').show();
    $('#panel-detail').hide();
    $('#panel-view').hide();

    $.get('/api/v1/docs/getpaper?id=' + id).done(function(data) 
    {
      paper=data.data;

      for (var k in data.data)
      {     
        $('#content-'+k).val(paper[k]);
      }

      document.getElementById('content-status').value = paper.status;
      document.getElementById('content-controlled').value = paper.controlled;
      document.getElementById('content-mandatory').value = paper.mandatory;

      $('#contentNewComment').val('');
      $('#content-tags').trigger('tags:refresh');
      setReadonly(true);

      // Pièces jointes dans la modal
      var attachHtml = '';
      var nb=0;
      if (data.docs)
      {
        for (var did in data.docs)
        {
            attachHtml += '<div id="docid_'+did+'" class="attach-pill '+((data.docs[did].read) ? "" : "unread")+'"><a href="/doc.php?docid='+data.docs[did].id+'" target="_blank" onclick="event.stopPropagation();">';
            attachHtml += '<i class="mdi mdi-file-' + data.docs[did].icon + '" style="color:' + data.docs[did].color + ';"></i>' + data.docs[did].name + '</a>';
            if (($("#content-status").val()=="open") || ($("#content-status").val()=="draft")) { attachHtml += '<a onclick="deleteDoc('+did+');">X</a>'; }
            attachHtml += '</div>';
            if (!data.docs[did].read) { nb++; }
        }
      }
      $('#modalAttachments').html(attachHtml);


      $('#modal-status').html("");
      $('.modal-header').removeClass("modal-danger");

      var dte_today = new Date();
      var dte_start = new Date(paper.dte_start); 
      var dte_end = new Date(paper.dte_end); 
      if (dte_end<dte_today)
      {
        $('#modal-status').html("Périmé");
      }

      if (data.data.controlled=="oui")
      {
        if (data.data.status=="approved")
        {
          $('#adddoc').hide();
          $("#duplicate").show();
        }
        else
        {
          $('#adddoc').show();
          $("#duplicate").hide();
        }

        if (data.data.status=="draft")
        {
          $('#submit').show();
          $('#modal-status').html("Brouillon");
          $('.modal-header').addClass("modal-danger");
        }
        else
        {
          $('#submit').hide();
        }
        if (data.data.status=="submitted")
        {
          $('#approve').show();
          $('#modal-status').html("Soumis");
        }
        else
        {
          $('#approve').hide();
        }

        $('#content-reference').show();
      }
      else
      {
        $('#content-reference').hide();
        $('#submit').hide();
        $('#approve').hide();
      }
      

      if (data.data.uid_checked>0)
      {
        $("#modalChecked").html('<i class="mdi mdi-lock-outline"></i> Revu par '+data.data.usr_checked+' le '+data.data.dte_checked);
      }
      else
      {
        $("#modalChecked").html('');
      }
      if (data.data.uid_approved>0)
      {
        $("#modalApproved").html('<i class="mdi mdi-lock-outline"></i> Approuvé par '+data.data.usr_approved+' le '+data.data.dte_approved);
      }
      else
      {
        $("#modalApproved").html('');
      }
      $('#modalSigned').html('');
      $('#modalReadAll').html('');
      
      if (data.data.mandatory=="non")
      {
          $('#modalReadAll').addClass("d-none");
          $('#btn-view').hide();
      }
      else if (nb>0)
      {
        $('#btn-view').show();
        $('#modalReadAll').html('<i class="mdi mdi-glasses"></i> Lisez tous les documents surlignés en rouge et rafraichissez la page. ('+nb+' document'+((nb>1) ? 's' : '')+' à lire)');
        $('#modalSigned').addClass("d-none");
        $('#modalConfirmRead').addClass("d-none");
      }
      else
      {
        $('#btn-view').show();
        $('#modalReadAll').addClass("d-none");
        if (data.data.read)
        {
            $('#modalSigned').html('<i class="mdi mdi-lock-outline"></i> Fiche lue le '+data.data.dte_read+'.');
            $('#modalSigned').removeClass("d-none");
            $('#modalConfirmRead').addClass("d-none");
            isSigned=true;
        }
        else
        {
            $('#modalSigned').addClass("d-none");
            $('#modalConfirmRead').removeClass("d-none");
            isAllRead=true;
        }
      }

      // Liste des vus
      $("#lst-view").html("");
      for (var k in data.read) 
      {
        txt ='<div class="read-row"><span class="read-name"><b>'+data.read[k].user+'</b></span>';
        if (data.read[k].dte_read!="-")
        {
          txt+='<span class="read-status st-read">Lu</span>';
        }
        else if (data.read[k].start)
        {
          txt+='<span class="read-status st-viewed">Ouvert</span>';
        }
        else
        {
          txt+='<span class="read-status st-unread">Non lu</span>';
        }
        txt+='<span class="read-date">'+data.read[k].dte_read+'</span></div>';

        $("#lst-view").append(txt);
      }     

      // Liste des commentaires
      $("#contentComment").html("");
      $.get('/api/v1/docs/lstcomment?id='+id).done(function(data)
      {
        for (var key in data.data)
        {
          var newComment='<div class="feed-item"><div class="feed-avatar"><img src="/'+data.data[key].avatar+'" alt="avatar"></div>';
          newComment+='<div class="feed-body"><div class="feed-title"><div class="feed-meta">'+data.data[key].author+'<span class="sep">·</span><i class="mdi mdi-clock-outline" style="font-size:.8rem;"></i>'+data.data[key].created+'</div></div>';
          newComment+='<p class="feed-text">'+data.data[key].description+'</p></div>';
          $("#contentComment").html($("#contentComment").html()+newComment);
        }
      });

      $('#paperContent').modal('show');
    });
  }

  function setReadonly(on) 
  {
    console.log(paper);
    ['#content-title','#content-dte_review','#content-mandatory'].forEach(function(sel) {
      $(sel).prop('disabled', on);
    });

    if (paper.controlled=="non")
    {
      ['#content-dte_start','#content-dte_end','#content-controlled','#content-nature','#content-history'].forEach(function(sel) {
        $(sel).prop('disabled', on);
      });
    }
    else
    {
      ['#content-dte_start','#content-dte_end','#content-controlled','#content-nature'].forEach(function(sel) {
        $(sel).prop('disabled', true);
      });      
    }

    if (paper.status=="draft")
    {
      ['#content-dte_start','#content-history'].forEach(function(sel) {
        $(sel).prop('disabled', on);
      });

      if ((paper.refid==0) || (paper.nature=="GEN"))
      {
        $('#content-nature').prop('disabled', on);
      }
    }

  }

  // ── Delete document ───────────────────────────────────────────
  function deleteDoc(did)
  {
    $.post('/api/v1/docs/postdoc?id='+did+'&dest=paper&fonc=delete', {})
    .done(function() {
      $("#docid_"+did).hide();
      loadPapers();
    });
  }

  // ── Boutons modal ─────────────────────────────────────────────
  
  // Edit
  $('#edit').on('click', function() {
    isEditing = !isEditing;
    setReadonly(!isEditing);
    $(this).find('i').toggleClass('mdi-pencil-outline mdi-pencil');
    $(this).toggleClass('active').css('background', isEditing ? '#eef3fc' : '').css('color', isEditing ? 'var(--primary)' : '');
  });

  // Archive
  $('#archive').on('click', function() {
    if (confirm('Archiver ce document ?')) archivePaper(currentPaper);
  });

  // Duplicate
  $('#duplicate').on('click', function() {
    if (confirm('Créer une nouvelle version de cette fiche ? ')) 
    {
      $.post('/api/v1/docs/postpaper', {
        id: currentPaper,
        fonc: 'duplicate',
      })
      .done(function() {
        $('#paperContent').modal('hide');
        loadPapers()
      })
      .fail(function(data) {
          console.log(data);
          showToast("",data.responseJSON.error,"error");
      });
    }

  });


  function archivePaper(id) {
    var today = new Date();
    var dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
    $.post('/api/v1/docs/postpaper', { id: id, data: { dte_end: dateStr }}).done(function() {
      $('#paperContent').modal('hide');
      loadPapers();
    });
  }

  $('#save').on('click', function() {
    if (isEditing)
    {
        $.post('/api/v1/docs/postpaper', {
            id: currentPaper,
            data: {
              title: $('#content-title').val(),
              controlled: $('#content-controlled').val(),
              mandatory: $('#content-mandatory').val(),
              history: $('#content-history').val(),
              tags: $('#content-tags').val(),
              nature: $('#content-nature').val(),
              dte_start: $('#content-dte_start').val(),
              dte_end: $('#content-dte_end').val(),
              dte_review: $('#content-dte_review').val()
            }
        }).done(function() {
            loadPapers();
        });
    }
    if ($("#contentNewComment").val()!="")
    {
        $.post( "/api/v1/docs/postcomment", { id: currentPaper, comment:$("#contentNewComment").val() } ).done(function(data) {
            console.log("Comment saved");
            $("#contentComment").html($("#contentComment").html()+$("#contentNewComment").val());
            //showComment(data.avatar,data.description,data.author,data.created);
        });
    }
    if (isAllRead)
    {
        console.log("Save reading confirmation");
        $.post( "/api/v1/docs/postread", { id: currentPaper } ).done(function(data) {
            console.log("Confirmation saved");
        });
    }

    $('#paperContent').modal('hide');
  });

  $('#submit').on('click', function() {
    if (confirm("Voulez lancer le processus d'approbation de ce document ? ")) 
    {
      $.post('/api/v1/docs/postpaper', {
            id: currentPaper,
            fonc: 'submit',
            data: {
              status: 'submitted'
            }
      }).done(function() {
      });
      $('#paperContent').modal('hide');
      loadPapers();
    }
  });

  $('#approve').on('click', function() {
    if (confirm('Voulez approuver ce document ? ')) 
    {
      $.post('/api/v1/docs/postpaper', {
        id: currentPaper,
        fonc: 'approve',
        data: {
          status: 'approved'
        }
      })
      .done(function() {
        $('#paperContent').modal('hide');
        loadPapers();
      })
      .fail(function(data) {
          console.log(data);
          showToast("",data.responseJSON.error,"error");
      });
    }
  });


  $('#cancel').on('click', function() { $('#paperContent').modal('hide'); });
  $('#close').on('click', function() { $('#paperContent').modal('hide'); });

  // ── Recherche ─────────────────────────────────────────────────
  var timer = null;
  function searchkey(e) {
    var key = e.which || (window.event && window.event.keyCode);
    if (key === 13) { loadPapers(); return false; }
    if (timer) clearTimeout(timer);
    timer = setTimeout(function() { timer = null; loadPapers(); }, 350);
  }



  // ── Upload drag & drop ────────────────────────────────────────
  $('html').on('dragover drop', function(e) { e.preventDefault(); e.stopPropagation(); });

  $('#newContentFile')
    .on('dragenter dragover', function() { $(this).addClass('drag-over'); })
    .on('dragleave',          function() { $(this).removeClass('drag-over'); })
    .on('drop', function(e) {
      $(this).removeClass('drag-over');
      e.stopPropagation(); e.preventDefault();
      var fd = new FormData();
      fd.append('file', e.originalEvent.dataTransfer.files[0]);
      uploadData(0, fd);
    });

  $('#newFile').on('change', function() {
    var fd = new FormData();
    fd.append('file', this.files[0]);
    uploadData(0, fd);
  });

  $('#addContentFile').on('drop', function(e) {
    e.stopPropagation(); e.preventDefault();
    var fd = new FormData();
    fd.append('file', e.originalEvent.dataTransfer.files[0]);
    uploadData(currentPaper, fd, "modal");
  });

  $('#addFile').on('change', function() {
    var fd = new FormData();
    fd.append('file', this.files[0]);
    uploadData(currentPaper, fd, "modal");
  });


  function uploadData(id, fd, src)
  {
      if (openFolder==0)
      {
          return;
      }
      $("#addContentText").html("Envoi du fichier...");

      $.ajax({
          url: '/api/v1/docs/postdoc?id='+id+'&dest=paper&folder='+openFolder,
          type: 'POST',
          data: fd,
          processData: false,
          contentType: false,
          success: function(response)
          {
            if (id === 0)
            {
              loadContent(response.id);
            } 

            if (src=="modal")
            {
              attachHtml  = '<div id="docid_'+response.data.id+'" class="attach-pill '+((response.data.read) ? "" : "unread")+'"><a href="/doc.php?docid='+response.data.id+'" target="_blank" onclick="event.stopPropagation();">';
              attachHtml += '<i class="mdi mdi-file-' + response.data.icon + '" style="color:' + response.data.color + ';"></i>' + response.data.name + '</a>';
              if (($("#content-status").val()=="open") || ($("#content-status").val()=="draft")) { attachHtml += '<a onclick="deleteDoc('+response.data.id+');">X</a>'; }
              attachHtml += '</div>';
              $('#modalAttachments').append(attachHtml);
            }

            $("#addContentText").html("Ajouter un fichier");
            loadPapers();
          }
      });
  }



  // -- Tags ------------------------------------------------------
  
  $('#content-tags').on('change', function()
  {

    console.log("change tags");

    var ids = $(this).val()
        .split(',')                                   // explode(',', …)
        .map(function (s) { return s.trim(); })       // enlève les espaces éventuels
        .filter(function (s) { return s !== ''; })   // enlève les valeurs vides
        .map(Number);

    $.post('/api/v1/docs/tags', {
      id: 0,
      data: {
        ids: ids,
        oid: paper.id,
        type: 'paper'
      }
    })
    .done(function() {

    })
    .fail(function(data) {
        console.log(data);
        showToast("",data.responseJSON.error,"error");
    });    



  });



  $(function () {
    var CONFIG = {
        input: '#content-tags',
        url: '/api/v1/docs/tags',
        valueField: 'id',         // ce que contient l'input : 'id' (4,12) ou 'name' (eleve,securite)
        minChars: 1,
        maxTags: 0,               // 0 = pas de limite
        placeholder: 'Ajouter un tag…',
        scope: {               // couleur et libellé par famille de tags
            audience: { label: 'Public', color: '#2f7fd1' },
            topic:    { label: 'Thème',  color: '#2e9e5b' },
            type:     { label: 'Nature', color: '#8e5bd1' },
            aircraft: { label: 'Avion',  color: '#c27c0e' }
        },
        defaultColor: '#6b7280'
    };
 
    var $input = $(CONFIG.input);
    if (!$input.length || $input.data('tagfield')) { return; }
    $input.data('tagfield', true);
 
    /* ---------- État ---------- */
    var readonly = $input.prop('disabled') || $input.prop('readonly');
    var known = {};          // valeur → { key, name, label, scope } (tout ce que l'API a renvoyé)
    var codes = splitCodes($input.val());
    var results = [];        // suggestions affichées
    var active = -1;         // index de la suggestion en surbrillance
    var requestId = 0;
    var timer = null;
    var uid = 'tagfield-' + Math.random().toString(36).slice(2, 8);
 
    /* ---------- Construction ---------- */
    var $field = $('<div class="tagfield">');
    var $box   = $('<div class="tagfield-box">').appendTo($field);
    var $entry = $('<input type="text" class="tagfield-entry" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">')
        .attr({ id: uid + '-entry', 'aria-controls': uid + '-menu', placeholder: CONFIG.placeholder });
    var $menu  = $('<ul class="tagfield-menu" role="listbox" hidden>').attr('id', uid + '-menu').appendTo($field);
 
    $input.hide().attr('aria-hidden', 'true').after($field);
    $('label[for="' + $input.attr('id') + '"]').attr('for', uid + '-entry');   // le label pointe sur la zone de saisie
    refresh();
 
    /* ---------- Fonctions ---------- */
 
    // Relit la valeur de l'input (et son état lecture seule), réaffiche les pastilles
    // et demande à l'API les libellés encore inconnus
    function refresh() {
        codes = splitCodes($input.val());
        readonly = $input.prop('disabled') || $input.prop('readonly');
        closeMenu();
        $entry.val('');
        $field.toggleClass('is-readonly', readonly);
        if (readonly) { $entry.detach(); } else if (!$entry.parent().length) { $box.append($entry); }
        render();
        resolveInitialLabels();
    }
    function splitCodes(value) {
        return String(value || '').split(',')
            .map(function (c) { return c.trim(); })
            .filter(function (c) { return c !== ''; });
    }
 
    function normalize(s) {   // pour comparer sans accents ni casse
        return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }
 
    function scopeOf(tag) {
        return CONFIG.scope[tag.scope] || { label: '', color: CONFIG.defaultColor };
    }
 
    // Accepte une liste (enveloppe avec data[]), un enregistrement (data{}) ou un simple tableau.
    // Champs : id, name (code du tag), scope (famille), label (facultatif : sinon on affiche name)
    function parseResponse(resp) {
        var data = resp && resp.data !== undefined ? resp.data : resp;
        var rows = Array.isArray(data) ? data : (data && typeof data === 'object' ? [data] : []);
        return $.map(rows, function (r) {
            if (!r || r[CONFIG.valueField] === undefined || r[CONFIG.valueField] === null) { return null; }
            var tag = {
                key:    String(r[CONFIG.valueField]),
                name:   String(r.name || ''),
                label:  String(r.label || r.name || r[CONFIG.valueField]),
                scope: r.scope || ''
            };
            known[tag.key] = tag;
            return tag;
        });
    }
 
    function render() {
        $box.children('.tagchip').remove();
        $.each(codes, function (i, key) {
            var tag = known[key] || { key: key, name: '', label: key, scope: '' };
            var fam = scopeOf(tag);
            var $chip = $('<span class="tagchip">').attr({ 'data-key': key, title: fam.label ? fam.label + ' : ' + tag.label : tag.label })
                .css('--tag', fam.color)
                .append($('<span class="tagchip-label">').text(tag.label));
            if (!readonly) {
                $chip.append($('<button type="button" class="tagchip-remove">×</button>').attr('aria-label', 'Retirer le tag ' + tag.label));
            }
            if (readonly) { $box.append($chip); } else { $chip.insertBefore($entry); }
        });
        var full = CONFIG.maxTags > 0 && codes.length >= CONFIG.maxTags;
        $entry.prop('disabled', full).attr('placeholder', full ? CONFIG.maxTags + ' tags maximum' : (codes.length ? '' : CONFIG.placeholder));
    }
 
    function sync() {
        $input.val(codes.join(',')).trigger('change');
        render();
    }
 
    function addTag(tag) {
        if ($.inArray(tag.key, codes) === -1 && !(CONFIG.maxTags > 0 && codes.length >= CONFIG.maxTags)) {
            known[tag.key] = tag;
            codes.push(tag.key);
            sync();
        }
        $entry.val('');
        closeMenu();
        $entry.trigger('focus');
    }
 
    function removeTag(key) {
        codes = $.grep(codes, function (c) { return c !== key; });
        sync();
        $entry.trigger('focus');
    }
 
    // Les tags déjà enregistrés n'ont que leur identifiant : on charge chacun auprès de l'API
    function resolveInitialLabels() {
        $.each(codes, function (i, key) {
            if (known[key]) { return; }                     // déjà connu : affiché tout de suite, sans appel
            var params = {};
            params[CONFIG.valueField === 'id' ? 'id' : 'term'] = key;
            $.getJSON(CONFIG.url, params).done(function (resp) {
                parseResponse(resp);
                render();
            });
        });
    }
 
    function search(term) {
        var id = ++requestId;
        $.getJSON(CONFIG.url, { term: term }).done(function (resp) {
            if (id !== requestId) { return; }               // réponse d'une frappe précédente : ignorée
            var found = parseResponse(resp);
            results = $.grep(found, function (t) { return $.inArray(t.key, codes) === -1; });
            // Les tags dont le libellé ou le code commence par la saisie passent en premier
            var needle = normalize(term);
            var starts = function (t) { return normalize(t.label).indexOf(needle) === 0 || normalize(t.name).indexOf(needle) === 0 ? 0 : 1; };
            results = results.map(function (t, i) { return [starts(t), i, t]; })
                             .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; })
                             .map(function (x) { return x[2]; });
            active = results.length ? 0 : -1;
            openMenu(term, found.length > 0);
        });
    }
 
    function openMenu(term, alreadyAdded) {
        $menu.empty();
        if (!results.length) {
            $menu.append($('<li class="tagfield-empty">').text(alreadyAdded
                ? 'Déjà ajouté'
                : 'Aucun tag ne correspond à « ' + term + ' »'));
        }
        var needle = normalize(term);
        $.each(results, function (i, tag) {
            var fam = scopeOf(tag);
            var $label = $('<span class="label">');
            var pos = normalize(tag.label).indexOf(needle);   // met en gras la partie tapée
            if (pos >= 0 && needle) {
                $label.append(document.createTextNode(tag.label.slice(0, pos)),
                              $('<b>').text(tag.label.slice(pos, pos + needle.length)),
                              document.createTextNode(tag.label.slice(pos + needle.length)));
            } else {
                $label.text(tag.label);
            }
            $('<li class="tagfield-option" role="option">')
                .attr({ id: uid + '-opt-' + i, 'data-index': i })
                .css('--tag', fam.color)
                .append('<span class="dot"></span>', $label, $('<span class="scope">').text(fam.label))
                .appendTo($menu);
        });
        $menu.prop('hidden', false);
        $entry.attr('aria-expanded', 'true');
        highlight();
    }
 
    function closeMenu() {
        clearTimeout(timer);
        requestId++;
        results = [];
        active = -1;
        $menu.prop('hidden', true).empty();
        $entry.attr('aria-expanded', 'false').removeAttr('aria-activedescendant');
    }
 
    function highlight() {
        var $options = $menu.children('.tagfield-option').removeClass('is-active').attr('aria-selected', 'false');
        if (active >= 0) {
            var $opt = $options.eq(active).addClass('is-active').attr('aria-selected', 'true');
            $entry.attr('aria-activedescendant', $opt.attr('id'));
            var el = $opt[0], menu = $menu[0];          // garde l'option visible dans la liste
            if (el.offsetTop < menu.scrollTop) { menu.scrollTop = el.offsetTop; }
            else if (el.offsetTop + el.offsetHeight > menu.scrollTop + menu.clientHeight) { menu.scrollTop = el.offsetTop + el.offsetHeight - menu.clientHeight; }
        } else {
            $entry.removeAttr('aria-activedescendant');
        }
    }
 
    function clearPending() { $box.children('.tagchip.is-pending').removeClass('is-pending'); }
 
    /* ---------- Événements ---------- */
 
    // À déclencher après avoir changé la valeur par programme, par exemple à l'ouverture d'une modale :
    //   $('#content-tags').val('securite,dr400').trigger('tags:refresh');
    $input.on('tags:refresh', refresh);
 
    $box.on('mousedown', function (e) {                 // clic dans le cadre : focus sur la saisie
        if (!$(e.target).is('.tagchip-remove, .tagfield-entry')) { e.preventDefault(); $entry.trigger('focus'); }
    });
    $box.on('click', '.tagchip-remove', function () {
        removeTag($(this).closest('.tagchip').attr('data-key'));
    });
 
    $entry.on('focus', function () { $field.addClass('is-focused'); })
          .on('blur', function () {
              // Le texte tapé sans choisir de tag est effacé : il ne doit pas laisser croire qu'il est enregistré
              $field.removeClass('is-focused'); clearPending(); closeMenu(); $entry.val('');
          });
 
    $entry.on('input', function () {
        clearPending();
        var term = $entry.val().trim();
        clearTimeout(timer);
        if (term.length < CONFIG.minChars) { closeMenu(); return; }
        timer = setTimeout(function () { search(term); }, 200);
    });
 
    $entry.on('keydown', function (e) {
        var open = !$menu.prop('hidden');
        switch (e.key) {
            case 'ArrowDown':
                if (open && results.length) { e.preventDefault(); active = (active + 1) % results.length; highlight(); }
                break;
            case 'ArrowUp':
                if (open && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; highlight(); }
                break;
            case 'Enter':
            case ',':
                if (open || $entry.val() !== '') { e.preventDefault(); }   // pas d'envoi du formulaire en cours de saisie
                if (open && active >= 0) { addTag(results[active]); }
                break;
            case 'Escape':
                if (open) { e.preventDefault(); closeMenu(); }
                break;
            case 'Backspace':
                if ($entry.val() === '' && codes.length) {
                    var $last = $box.children('.tagchip').last();
                    if ($last.hasClass('is-pending')) { removeTag(codes[codes.length - 1]); }
                    else { $last.addClass('is-pending'); }
                    e.preventDefault();
                }
                break;
            default:
                clearPending();
        }
    });
 
    // mousedown (et non click) : l'option est choisie avant que la saisie ne perde le focus
    $menu.on('mousedown', '.tagfield-option', function (e) {
        e.preventDefault();
        addTag(results[$(this).data('index')]);
    });
    $menu.on('mousemove', '.tagfield-option', function () {
        var i = $(this).data('index');
        if (i !== active) { active = i; highlight(); }
    });
});


</script>
