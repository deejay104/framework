<style>
/* ── Styles locaux — page Documents ── */
.card-body .form-inline { height: 30px; }
.form-inline { gap: unset; margin-bottom:10px;  }

/* Barre de filtres */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-end;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-group label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--p67-text-muted);
  margin: 0;
}
.filter-group.filter-search { flex: 1; min-width: 180px; }
.filter-group.filter-search .input-wrap { position: relative; }
.filter-group.filter-search .input-wrap .mdi {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--p67-text-muted);
  font-size: 1rem;
  pointer-events: none;
}
.filter-group.filter-search input { padding-left: 32px; }

/* Zone d'upload */
.upload-zone {
  border: 2px dashed var(--p67-primary-border);
  background: var(--p67-primary-light);
  padding: 5px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  color: var(--p67-text-muted);
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--p67-primary);
  background: #e4edfa;
  color: var(--p67-primary);
}
.upload-zone .mdi { font-size: 1.8rem; display: block; margin-bottom: 4px; }
.upload-zone p  { margin: 0; font-size: 0.85rem; font-weight: 500; }
.upload-zone small { font-size: 0.75rem; }

/* Liste de documents */
.paper-list{display:flex;flex-direction:column;gap:10px;}
.paper-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--p67-border);
  cursor: pointer;
  transition:box-shadow .15s,border-color .15s;
  position: relative;
}
.paper-item:last-child { border-bottom: none; }
.paper-item:hover { background: var(--p67-primary-light); }


.paper-item2{display:flex;gap:12px;background:var(--pi-bg);border:1px solid var(--pi-border);border-left:4px solid var(--pi-border);
  border-radius:8px;padding:12px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.paper-item2:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.paper-item2:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(47,127,209,.35);}
.paper-item2.is-selected{border-color:#9cc3ea;}

.paper-ico {
  width: 38px; height: 38px; min-width: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--p67-primary-light);
  border: 1px solid var(--p67-primary-border);
  flex-shrink: 0;
  margin-top: 2px;
  transition: background .15s;
}
.paper-ico .mdi { font-size: 1.2rem; color: var(--p67-primary); }
.paper-item:hover .paper-ico { background: var(--p67-primary); }
.paper-item:hover .paper-ico .mdi { color: #fff; }

.paper-content { flex: 1; min-width: 0; }

.paper-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--p67-text);
  margin-bottom: 3px;
  line-height: 1.3;
}

.paper-head{display:flex;align-items:flex-start;gap:6px 10px;flex-wrap:wrap;}
.paper-title-line {flex:1 1 260px;min-width:0;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;}

.paper-ref{font:600 12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#334155;background:var(--p67-bg); border-radius:4px;padding:4px 10px;white-space:nowrap;}
.paper-ref .mdi{color:var(--p67-text);margin-right:3px;}


.paper-meta {
  font-size: 0.78rem;
  color: var(--p67-text-muted);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.paper-meta span { display: flex; align-items: center; gap: 4px; }
.paper-meta .mdi { font-size: 0.85rem; }


.paper-ico{ font-size:26px;line-height:1;padding-top:1px;color:#8a96a3;}

.paper-state-draft   {border-left:4px solid var(--p67-border); background:var(--bg);}
.paper-state-expired {border-left:4px solid var(--p67-danger); background:var(--p67-danger-soft);}

.paper-state-current2 .paper-ico { background-color:var(--p67-success-soft);}
.paper-state-expired .paper-ico { border:1px solid var(--p67-danger); background-color:var(--p67-danger-soft);}


.paper-state-upcoming{border-left-color:var(--st-upcoming);}
.paper-state-checked {border-left-color:var(--st-checked);}






/* Pièces jointes en pills */
.paper-attachments { display: flex; flex-wrap: wrap; gap: 5px; }


.attach-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--p67-border);
  background: #f7f9fc;
  font-size: 0.75rem;
  font-weight: 500;
  
  border-radius: 10px;
  transition: background .15s, border-color .15s, color .15s;
  height: 30px;
  white-space: nowrap;
  overflow: hidden;
}
.attach-pill:hover {
  background: var(--p67-primary-light)!important;
  border-color: var(--p67-primary)!important;
}
.attach-pill a:hover {
  text-decoration: none;
  color: var(--p67-primary);
}
.attach-pill a {
  padding: 2px 9px;
  text-decoration: none;
  color: var(--p67-text);
}

/* Unread documents */
.attach-pill.unread {
  background-color: var(--p67-danger-soft);
  border: 1px solid var(--p67-danger);
}
.attach-pill .mdi { font-size: 0.85rem; }

/* Boutons d'action (hover) */
.paper-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity .15s;
  flex-shrink: 0;
  padding-top: 2px;
}
.paper-item:hover .paper-actions { opacity: 1; }

.action-btn {
  width: 30px; height: 30px;
  border: none;
  background: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--p67-text-muted);
  cursor: pointer;
  font-size: 0.95rem;
  border-radius: 4px;
  transition: background .15s, color .15s;
}
.action-btn:hover { background: var(--p67-primary-light); color: var(--p67-primary); }
.action-btn.danger:hover { background: var(--p67-danger-soft); color: var(--p67-danger); }

/* État vide */
.paper-empty {
  padding: 40px;
  text-align: center;
  color: var(--p67-text-muted);
}
.paper-empty .mdi { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: .4; }

/* Modal — ajustements */
.modal-header-actions { display: flex; align-items: center; gap: 6px; }
.modal-icon-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--p67-border);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--p67-text-muted);
  font-size: 1rem;
  border-radius: 4px;
  transition: background .15s, color .15s, border-color .15s;
}
.modal-icon-btn:hover { background: var(--p67-primary-light); color: var(--p67-primary); border-color: var(--p67-primary-border); }
.modal-icon-btn.danger:hover { background: var(--p67-danger-soft); color: var(--p67-danger); border-color: #f5b8b5; }

.modal-fields-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}

.modal-upload-zone {
  border: 1.5px dashed var(--p67-primary-border);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  background: var(--p67-primary-light);
  color: var(--p67-text-muted);
  font-size: 0.82rem;
}
.modal-upload-zone:hover { border: 2px dashed var(--p67-primary); color: var(--p67-primary); background: #e4edfa; padding: 11px; }
.modal-upload-zone .mdi { font-size: 1.3rem; }

.modal-divider { height: 1px; background: var(--p67-border); margin: 16px 0; }

/* Commentaires dans modal */
.comment-block {
  background: var(--p67-primary-light);
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 0.82rem;
  color: var(--p67-text);
  border-left: 3px solid var(--p67-primary);
}
.comment-block .c-meta { font-size: 0.72rem; color: var(--p67-text-muted); margin-top: 4px; }

/* Compteur de documents */
#paperCount {
  font-size: 0.75rem;
  color: var(--p67-text-muted);
  font-weight: 400;
  margin-left: auto;
}



/* Badge */
.badge-wrapper {display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.badge-doc {display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.5; padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;text-transform:uppercase;}
.badge-mandatory { background-color:var(--p67-warning); }
.badge-controlled { background-color:var(--p67-success); }
.badge-expired { background-color:var(--p67-bg); border:1px solid var(--p67-border); }
.badge-review { background-color:var(--p67-warning); color:#ffffff;}
.badge-toread { background-color:var(--p67-danger); color:#ffffff; }
.badge-draft { background-color:var(--p67-white); border:1px solid var(--p67-border); }
.badge-submitted { background-color:var(--p67-success); color:#ffffff; }

</style>

<script>
  /* ═══════════════════════════════════════════════════
     LOGIQUE — identique à l'original, rendu amélioré
     ═══════════════════════════════════════════════════ */

  $(document).ready(function() { loadPapers(); });

  var currentPaper = 0;
  var isEditing = false;
  var isAllRead = false;
  var isSigned = false;
  var lstDocuments = [];
  var openPaper = {paper};

// ── Chargement liste ──────────────────────────────────────────
  function loadPapers() {
    var filter = $('#selectFilter').val();
    var date   = $('#selectDate').val();
    var crit   = $('#crit').val();
    var sort   = $('#selectSort').val();

    $.get('/api/v1/docs/lstpaper?id={id}&filter='+filter+'&date='+date+'&sort='+sort+'&crit='+crit)
      .done(function(data){ 
        $('#lstPapers').html('');

        for (var k in data.data) 
        {
          console.log(data.data[k])
          renderPapers(data.data[k]);
        }

        if (openPaper>0)
        {
          loadContent(openPaper);
        }

      });

  }

  function renderPapers(data) 
  {
    var html = '';
    var dte_today = new Date();
    var dte_start = new Date(data.dte_start); 
    var dte_end = new Date(data.dte_end); 
    var dte_review = new Date(data.dte_review); 

    var paperStatus="";
    var paperStatusClass="";

    if (dte_end<dte_today)
    {
      paperStatusClass = 'paper-state-expired';
      paperStatus="expired";
    }
    else if (dte_start>dte_today)
    {
      paperStatusClass = 'paper-state-future';
      paperStatus="future";
    }
    else
    {
      paperStatusClass = 'paper-state-current';
      paperStatus="current";
    }

    if (data.status=='draft')
    {
      paperStatusClass = 'paper-state-draft';
      paperStatus="draft";
    }
    else if (data.status=='submitted')
    {
      paperStatusClass = 'paper-state-draft';
      paperStatus="submitted";
    }
    else if (data.status=='open')
    {
      paperStatus="open";
    }


    html='<div class="paper-item '+paperStatusClass+'" id="paperItem_51" tabindex="0" role="link" onclick="loadContent('+data.id+');">';
    html+='<div class="paper-ico"><i class="mdi mdi-file-document-outline"></i></div>';
    html+='<div class="paper-content">';
    html+='  <div class="paper-head">';
    html+='    <div class="paper-title-line">';
    if (data.controlled=='oui')
    {
      html+='      <span class="paper-ref" title="Document contrôlé"><i class="mdi mdi-shield-check-outline"></i>'+data.reference+'</span>';
      html+='      <span class="paper-version">v'+data.version+'</span>';
    }
    html+='      <span class="paper-title" id="paperTitle_51">'+data.title+'</span>';
    html+='    </div>';
    html+='    <div class="badge-wrapper">';

    // Brouillon
    if (data.status=='draft')
    {
      html+='      <span class="badge-doc badge-draft">Brouillon</span>';
    }
    // Doc à approuver
    if (data.status=='submitted')
    {
      html += '<span class="badge-doc badge-submitted">Soumis</span>';
    }
    // Doc à relire
    if (dte_review<dte_today)
    {
      html += '<span class="badge-doc badge-review">Revue échue</span>';
    }
    // Doc périmé
    if (dte_end<dte_today)
    {
      html += '<span class="badge-doc badge-expired">Périmé</span>';
    }
    // Doc non lu
    if (data.mandatory=='oui')
    {
      html += '<span class="badge-doc badge-toread">A lire</span>';
    }


    html+='    </div>';
    html+='  </div>';
    html+='  <div class="paper-meta">';

    if (paperStatus=="current")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-check-circle-outline"></i>En vigueur depuis le '+data.begin+'</span>';
    }
    else if (paperStatus=="submitted")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clipboard-check-outline"></i>Vérifié le '+data.checked+' par '+data.reviewer+'</span>';
    }
    else if (paperStatus=="draft")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clock-outline"></i>Modifié le '+data.created+'</span>';
    }
    else if (paperStatus=="expired")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-archive-outline"></i>Périmé depuis le '+data.expire+'</span>';
    }
    else if (paperStatus=="open")
    {
      html+='    <span class="meta-state"><i class="mdi mdi-clock-outline"></i>Ajouté le '+data.created+'</span>';
    }

    html+=' - <span><i class="mdi mdi-account-outline"></i>'+data.author+'</span>';
    <!-- BEGIN: writer -->
    if (data.mandatory=='oui')
    {
      html+='    <span class="writer-only"><i class="mdi mdi-account-multiple-check"></i>Lu par '+data.nbread+' / '+data.nbtotalread+'</span>';
    }
    <!-- END: writer -->

    html+='  </div>';
    html+='  <div class="paper-attachments">';

    for (var d in data.doc) {
      html += '<div class="attach-pill '+((data.doc[d].read) ? "" : "unread")+'"><a href="/doc.php?lien='+data.doc[d].id+'" target="_blank" onclick="event.stopPropagation();">';
      html += '<i class="mdi mdi-file-'+data.doc[d].icon+'" style="color:'+data.doc[d].color+';"></i> ' + data.doc[d].name + '</a></div>';
    }
    html+='  </div>';
    html+='</div>';
    html+='</div>';

    $('#lstPapers').append(html);
  }

  // ── Ouverture modal ───────────────────────────────────────────
  function loadContent(id)
  {
    currentPaper = id;
    isEditing = false;

    $.get('/api/v1/docs/getpaper?id=' + id).done(function(data) {

      for (var k in data.data)
      {     
        $('#content-'+k).val(data.data[k]);
      }

      document.getElementById('content-status').value = data.data.status;
      document.getElementById('content-controlled').value = data.data.controlled;
      document.getElementById('content-mandatory').value = data.data.mandatory;
      $('#contentNewComment').val('');
      setReadonly(true);

      // Pièces jointes dans la modal
      var attachHtml = '';
      var nb=0;
      if (data.docs)
      {
        for (var did in data.docs)
        {
            attachHtml += '<div id="docid_'+did+'" class="attach-pill '+((data.docs[did].read) ? "" : "unread")+'"><a href="/doc.php?docid='+data.docs[did].id+'" target="_blank" onclick="event.stopPropagation();">';
            attachHtml += '<i class="mdi mdi-file-' + data.docs[did].icon + '" style="color:' + data.docs[did].color + ';"></i>' + data.docs[did].name + '</a>';
            if (($("#content-status").val()=="open") || ($("#content-status").val()=="draft")) { attachHtml += '<a onclick="deleteDoc('+did+');">X</a>'; }
            attachHtml += '</div>';
            if (!data.docs[did].read) { nb++; }
        }
      }
      $('#modalAttachments').html(attachHtml);

      if ((data.data.controlled=="oui") && (data.data.status=="approved"))
      {
        $('#adddoc').hide();
        $("#duplicate").show();
      }
      else
      {
        $('#adddoc').show();
        $("#duplicate").hide();
      }

      if ((data.data.controlled=="oui") && (data.data.status=="draft"))
      {
        $('#submit').show();
      }
      else
      {
        $('#submit').hide();
      }
      if ((data.data.controlled=="oui") && (data.data.status=="submitted"))
      {
        $('#approve').show();
      }
      else
      {
        $('#approve').hide();
      }

      if (data.data.uid_checked>0)
      {
        $("#modalChecked").html('<i class="mdi mdi-lock-outline"></i> Revu par '+data.data.usr_checked+' le '+data.data.dte_checked);
      }
      else
      {
        $("#modalChecked").html('');
      }
      if (data.data.uid_approved>0)
      {
        $("#modalApproved").html('<i class="mdi mdi-lock-outline"></i> Approuvé par '+data.data.usr_approved+' le '+data.data.dte_approved);
      }
      else
      {
        $("#modalApproved").html('');
      }
      
      if (data.data.mandatory=="non")
      {
          $('#modalReadAll').addClass("d-none");
      }
      else if (nb>0)
      {
          $('#modalReadAll').html('<i class="mdi mdi-glasses"></i> Lisez tous les documents surlignés en rouge et rafraichissez la page. ('+nb+' document'+((nb>1) ? 's' : '')+' à lire)');
          $('#modalSigned').addClass("d-none");
          $('#modalConfirmRead').addClass("d-none");
      }
      else
      {
          $('#modalReadAll').addClass("d-none");
          if (data.data.read)
          {
              $('#modalSigned').html('<i class="mdi mdi-lock-outline"></i> Fiche lue le '+data.data.dte_read+'.');
              $('#modalSigned').removeClass("d-none");
              $('#modalConfirmRead').addClass("d-none");
              isSigned=true;
          }
          else
          {
              $('#modalSigned').addClass("d-none");
              $('#modalConfirmRead').removeClass("d-none");
              isAllRead=true;
          }
      }

      $("#contentComment").html("");
      $.get('/api/v1/docs/lstcomment?id='+id).done(function(data)
      {
        for (var key in data.data)
        {
          var newComment='<div class="feed-item"><div class="feed-avatar"><img src="/'+data.data[key].avatar+'" alt="avatar"></div>';
          newComment+='<div class="feed-body"><div class="feed-title"><div class="feed-meta">'+data.data[key].author+'<span class="sep">·</span><i class="mdi mdi-clock-outline" style="font-size:.8rem;"></i>'+data.data[key].created+'</div></div>';
          newComment+='<p class="feed-text">'+data.data[key].description+'</p></div>';
          $("#contentComment").html($("#contentComment").html()+newComment);
        }
      });

      $('#paperContent').modal('show');
    });
  }

  function setReadonly(on) {
    ['#content-title','#content-dte_review','#content-mandatory'].forEach(function(sel) {
      $(sel).prop('disabled', on);
    });

    if ($('#content-controlled').val()=="non")
    {
      ['#content-dte_start','#content-dte_end','#content-controlled','#content-nature','#content-history'].forEach(function(sel) {
        $(sel).prop('disabled', on);
      });
    }
    else
    {
      ['#content-dte_start','#content-dte_end','#content-controlled','#content-nature'].forEach(function(sel) {
        $(sel).prop('disabled', true);
      });      
    }

    if ($('#content-status').val()=="draft")
    {
      ['#content-dte_start','#content-history'].forEach(function(sel) {
        $(sel).prop('disabled', on);
      });

      if ($('#content-nature').val()=="GEN")
      {
        $('#content-nature').prop('disabled', on);
      }
    }

  }

  // ── Delete document ───────────────────────────────────────────
  function deleteDoc(did)
  {
    $.post('/api/v1/docs/postdoc?id='+did+'&dest=paper&fonc=delete', {})
    .done(function() {
      $("#docid_"+did).hide();
      loadPapers();
    });
  }

  // ── Boutons modal ─────────────────────────────────────────────
  
  // Edit
  $('#edit').on('click', function() {
    isEditing = !isEditing;
    setReadonly(!isEditing);
    $(this).find('i').toggleClass('mdi-pencil-outline mdi-pencil');
    $(this).toggleClass('active').css('background', isEditing ? '#eef3fc' : '').css('color', isEditing ? 'var(--primary)' : '');
  });

  // Archive
  $('#archive').on('click', function() {
    if (confirm('Archiver ce document ?')) archivePaper(currentPaper);
  });

  // Duplicate
  $('#duplicate').on('click', function() {
    if (confirm('Créer une nouvelle version de cette fiche ? ')) 
    {
      $.post('/api/v1/docs/postpaper', {
        id: currentPaper,
        fonc: 'duplicate',
      })
      .done(function() {
        $('#paperContent').modal('hide');
        loadPapers()
      })
      .fail(function(data) {
          console.log(data);
          showToast("",data.responseJSON.error,"error");
      });
    }

  });


  function archivePaper(id) {
    var today = new Date();
    var dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
    $.post('/api/v1/docs/postpaper', { id: id, data: { dte_end: dateStr }}).done(function() {
      $('#paperContent').modal('hide');
      loadPapers();
    });
  }

  $('#save').on('click', function() {
    if (isEditing)
    {
        $.post('/api/v1/docs/postpaper', {
            id: currentPaper,
            data: {
              title: $('#content-title').val(),
              controlled: $('#content-controlled').val(),
              mandatory: $('#content-mandatory').val(),
              history: $('#content-history').val(),
              nature: $('#content-nature').val(),
              dte_start: $('#content-dte_start').val(),
              dte_end: $('#content-dte_end').val(),
              dte_review: $('#content-dte_review').val()
            }
        }).done(function() {
            loadPapers();
        });
    }
    if ($("#contentNewComment").val()!="")
    {
        $.post( "/api/v1/docs/postcomment", { id: currentPaper, comment:$("#contentNewComment").val() } ).done(function(data) {
            console.log("Comment saved");
            $("#contentComment").html($("#contentComment").html()+$("#contentNewComment").val());
            //showComment(data.avatar,data.description,data.author,data.created);
        });
    }
    if (isAllRead)
    {
        console.log("Save reading confirmation");
        $.post( "/api/v1/docs/postread", { id: currentPaper } ).done(function(data) {
            console.log("Confirmation saved");
        });
    }

    $('#paperContent').modal('hide');
  });

  $('#submit').on('click', function() {
    if (confirm("Voulez lancer le processus d'approbation de ce document ? ")) 
    {
      $.post('/api/v1/docs/postpaper', {
            id: currentPaper,
            fonc: 'submit',
            data: {
              status: 'submitted'
            }
      }).done(function() {
      });
      $('#paperContent').modal('hide');
      loadPapers();
    }
  });

  $('#approve').on('click', function() {
    if (confirm('Voulez approuver ce document ? ')) 
    {
      $.post('/api/v1/docs/postpaper', {
        id: currentPaper,
        fonc: 'approve',
        data: {
          status: 'approved'
        }
      })
      .done(function() {
        $('#paperContent').modal('hide');
        loadPapers();
      })
      .fail(function(data) {
          console.log(data);
          showToast("",data.responseJSON.error,"error");
      });
    }
  });


  $('#cancel').on('click', function() { $('#paperContent').modal('hide'); });
  $('#close').on('click', function() { $('#paperContent').modal('hide'); });

  // ── Recherche ─────────────────────────────────────────────────
  var timer = null;
  function searchkey(e) {
    var key = e.which || (window.event && window.event.keyCode);
    if (key === 13) { loadPapers(); return false; }
    if (timer) clearTimeout(timer);
    timer = setTimeout(function() { timer = null; loadPapers(); }, 350);
  }

  // ── Upload drag & drop ────────────────────────────────────────
  $('html').on('dragover drop', function(e) { e.preventDefault(); e.stopPropagation(); });

  $('#newContentFile')
    .on('dragenter dragover', function() { $(this).addClass('drag-over'); })
    .on('dragleave',          function() { $(this).removeClass('drag-over'); })
    .on('drop', function(e) {
      $(this).removeClass('drag-over');
      e.stopPropagation(); e.preventDefault();
      var fd = new FormData();
      fd.append('file', e.originalEvent.dataTransfer.files[0]);
      uploadData(0, fd);
    });

  $('#newFile').on('change', function() {
    var fd = new FormData();
    fd.append('file', this.files[0]);
    uploadData(0, fd);
  });

  $('#addContentFile').on('drop', function(e) {
    e.stopPropagation(); e.preventDefault();
    var fd = new FormData();
    fd.append('file', e.originalEvent.dataTransfer.files[0]);
    uploadData(currentPaper, fd, "modal");
  });

  $('#addFile').on('change', function() {
    var fd = new FormData();
    fd.append('file', this.files[0]);
    uploadData(currentPaper, fd, "modal");
  });


  function uploadData(id, fd, src)
  {
      folder={id};
      if (folder==0)
      {
          return;
      }
      $("#addContentText").html("Envoi du fichier...");

      $.ajax({
          url: '/api/v1/docs/postdoc?id='+id+'&dest=paper&folder='+folder,
          type: 'POST',
          data: fd,
          processData: false,
          contentType: false,
          success: function(response)
          {
            if (id === 0)
            {
              loadContent(response.id);
            } 

            if (src=="modal")
            {
              attachHtml  = '<div id="docid_'+response.data.id+'" class="attach-pill '+((response.data.read) ? "" : "unread")+'"><a href="/doc.php?docid='+response.data.id+'" target="_blank" onclick="event.stopPropagation();">';
              attachHtml += '<i class="mdi mdi-file-' + response.data.icon + '" style="color:' + response.data.color + ';"></i>' + response.data.name + '</a>';
              if (($("#content-status").val()=="open") || ($("#content-status").val()=="draft")) { attachHtml += '<a onclick="deleteDoc('+response.data.id+');">X</a>'; }
              attachHtml += '</div>';
              $('#modalAttachments').append(attachHtml);
            }

            $("#addContentText").html("Ajouter un fichier");
            loadPapers();
          }
      });
  }
</script>
